<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baims' Group Leadership Hub</title>
  <link rel="icon" type="image/png" href="baims-logo.png">

  <!-- Database config — edit components/config.js to set Supabase credentials -->
  <script src="components/config.js"></script>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- Babel standalone for JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif;
      background: #F5F6FA;
      color: #111827;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }
    button { font-family: inherit; }
    input, textarea, select { font-family: inherit; }
    [draggable="true"] { cursor: grab; }
    [draggable="true"]:active { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#6B7280;font-size:14px;">
      Loading Baims' Group Leadership Hub…
    </div>
  </div>

  <!-- Load in dependency order — each file exposes exports via window globals -->
  <script type="text/babel" src="components/shared.jsx"        data-presets="react"></script>
  <script type="text/babel" src="components/db.jsx"            data-presets="react"></script>
  <script type="text/babel" src="components/Login.jsx"         data-presets="react"></script>
  <script type="text/babel" src="components/Sidebar.jsx"       data-presets="react"></script>
  <script type="text/babel" src="components/WeeklyMeeting.jsx" data-presets="react"></script>
  <script type="text/babel" src="components/Boards.jsx"        data-presets="react"></script>
  <script type="text/babel" src="components/Dashboard.jsx"     data-presets="react"></script>
  <script type="text/babel" src="components/Search.jsx"        data-presets="react"></script>
  <script type="text/babel" src="components/Setup.jsx"         data-presets="react"></script>
  <script type="text/babel" src="components/App.jsx"           data-presets="react"></script>
</body>
</html>
